<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAVAS</title>
</head>
<body bgcolor="">
    <script>
        function cube()
        {
        var a=document.getElementById("value1").value;
        document.write("The cube of "+a+" = "+a*a*a);
        }
    </script>

      <input type="text" id="value1">
      <button type="button" onclick="cube()">Cube</button>


      <script>
        function add()
        {
            var n1=parseInt(document.getElementById("value1").value);    
            var n2=parseInt(document.getElementById("value2").value);
            var sum=n1+n2

            document.getElementById("demo").innerHTML=sum;
        }   
    </script>
    
    <input type="text" placeholder="Enter first number" id="value1">
    <input type="text" placeholder="Enter second number" id="value2">
    <button type="button" onclick="add()">Addition</button>
    <p id="demo"></p>

<p>2<sub>10</sub></p>
<p>2<sup>10</sup></p>

    








</body>
</html>
