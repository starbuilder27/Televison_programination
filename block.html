<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><param ></title>
    <style>
        select{
            background-color: Green;
            color: white;
            width: 39%;
            height: 1cm;
        }
    </style>

    <style>
        select option {
            background-color: lightslategray;
            color: black;
            
        }
    </style>

    <style>
        select optgroup{
            background-color: lightseagreen;
            color: yellow;
            
        }
    </style>

</head>
<body>
    <form>
        <select>
        <option>--Academic--</option>    
        <option>9th</option>
        <option>10th</option>
        <option>12th</option>
        <option>Graduation</option>
        <option>Post Graduation</option>
        </select>    
</form>   
    <br>
    
<form>
    <select>
        <option>--Computer Course--</option>
        <optgroup label="3 months course"></optgroup>    
        <option>BCC</option>
        <option>CCF</option>
         <optgroup label="6 months course"></optgroup>
        <option>DCA</option>
        <option>DFA</option>
         <optgroup label="1 Year course"></optgroup>
        <option>ADCA</option>
        <option>ADFA</option>
    </select>  
</form>
<br>

<form>
    <select>
        <option>--Language--</option>
        <option>English</option>
        <option>Hindi</option>
        <option>Marathi</option>
        <option>Telugu</option>
        <option>Tamil</option>
        <option>Kannada</option>
    </select>
</form>
<br>

<form>
    <select>
        <option>--Hobbies--</option>
        <option>Reading</option>
        <option>Writing</option>
        <option>Drawing</option>
        <option>Painting</option>
        <option>Music</option>
        <option>Games</option>
    </select>
</form>
<br>
  
<form>
    <select>
        <option>--Gender--</option>
        <option>Male</option>
        <option>Female</option>
        <option>Other</option>
    </select>
</form>  
<br>
<form>
    <input type="submit" value="Submit">
</form>
</body>
</html>
