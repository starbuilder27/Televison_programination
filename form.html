<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
</head>
<body>
    <style>
        body{background: #aee9ff;font-family: Arial, sans-serif;padding:20px}
        form{max-width:700px;margin:18px auto;background:#fff;padding:18px;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,0.08)}
        fieldset{border:1px solid #ddd;padding:14px;border-radius:6px}
        legend{font-weight:bold;padding:0 6px}
        .row{display:flex;gap:12px;align-items:center;margin:8px 0}
        .row label{width:140px;font-weight:600}
        .row input[type=text], .row input[type=email], .row input[type=tel]{flex:1;padding:8px;border:1px solid #ccc;border-radius:4px}
        .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
        .msg{margin-top:12px;padding:10px;border-radius:6px}
        .msg.success{background:#e6ffed;border:1px solid #b7f0c6}
        .msg.error{background:#ffecec;border:1px solid #f0b7b7}
        #submissions{margin-top:14px}
        .submission{padding:8px;border-bottom:1px solid #eee}
    </style>

    <form id="personalForm" novalidate>
        <fieldset>
            <legend>Personal Information</legend>

            <div class="row">
                <label for="firstName">First Name</label>
                <input id="firstName" name="firstName" type="text" required placeholder="Given name">
            </div>

            <div class="row">
                <label for="lastName">Last Name</label>
                <input id="lastName" name="lastName" type="text" required placeholder="Surname">
            </div>

            <div class="row">
                <label for="fatherName">Father's Name</label>
                <input id="fatherName" name="fatherName" type="text" placeholder="Father's full name">
            </div>

            <div class="row">
                <label for="motherName">Mother's Name</label>
                <input id="motherName" name="motherName" type="text" placeholder="Mother's full name">
            </div>

            <div class="row">
                <label>Gender</label>
                <label><input type="radio" name="gender" value="Male" required> Male</label>
                <label><input type="radio" name="gender" value="Female"> Female</label>
                <label><input type="radio" name="gender" value="Other"> Other</label>
            </div>

            <div class="row">
                <label for="phone">Phone Number</label>
                <input id="phone" name="phone" type="tel" pattern="[0-9]{10}" placeholder="10-digit number" required>
            </div>

            <div class="row">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" placeholder="you@example.com" required>
            </div>

            <div class="actions">
                <button type="reset">Reset</button>
                <button type="submit">Submit</button>
            </div>

            <div id="formMessage" class="msg" style="display:none"></div>
            <div id="submissions"></div>

        </fieldset>
    </form>

    <script>
        (function(){
            const form = document.getElementById('personalForm');
            const msg = document.getElementById('formMessage');
            const submissionsEl = document.getElementById('submissions');
            const STORAGE_KEY = 'personal_submissions_v1';

            function showMessage(text, type){
                msg.textContent = text; msg.className = 'msg ' + (type==='success'? 'success':'error'); msg.style.display = 'block';
                setTimeout(()=>{ msg.style.display = 'none'; }, 4000);
            }

            function loadSubmissions(){
                const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
                submissionsEl.innerHTML = '';
                if(data.length === 0) return;
                data.slice().reverse().forEach(s => {
                    const d = document.createElement('div'); d.className = 'submission';
                    d.innerHTML = '<strong>'+s.firstName+' '+s.lastName+'</strong> ('+s.email+') — '+new Date(s.createdAt).toLocaleString();
                    submissionsEl.appendChild(d);
                });
            }

            form.addEventListener('submit', function(e){
                e.preventDefault();
                // simple built-in validity check
                if(!form.checkValidity()){
                    showMessage('Please fill required fields correctly.', 'error');
                    return;
                }
                // collect values
                const data = {
                    firstName: form.firstName.value.trim(),
                    lastName: form.lastName.value.trim(),
                    fatherName: form.fatherName.value.trim(),
                    motherName: form.motherName.value.trim(),
                    gender: form.gender.value,
                    phone: form.phone.value.trim(),
                    email: form.email.value.trim(),
                    createdAt: Date.now()
                };
                // save to localStorage
                const arr = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
                arr.push(data);
                localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
                showMessage('Submission saved locally.', 'success');
                form.reset();
                loadSubmissions();
            });

            // show existing on load
            loadSubmissions();
        })();
    </script>


    













</body>
